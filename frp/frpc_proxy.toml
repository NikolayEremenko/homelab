user = "proxy"

# Address of the frp server (taken from the environment),
# along with its port
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = 7000

# Token for authenticating with server
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

# Client-Server mTLS certificates
transport.tls.enable = true
transport.tls.certFile = "/opt/frp_certs/frpc.crt"
transport.tls.keyFile = "/opt/frp_certs/frpc.key"
transport.tls.trustedCaFile = "/opt/frp_certs/ca.crt"

# Proxy for HTTP traffic → ingress controller (port 80)
[[proxies]]
name = "http"
type = "http"
localIP = "{{ .Envs.INGRESS_IP }}"
localPort = 80
customDomains = ["demothings.ru"]

# Proxy for HTTPS traffic → ingress controller (port 443)
[[proxies]]
name = "https"
type = "https"
localIP = "{{ .Envs.INGRESS_IP }}"
localPort = 443
customDomains = ["grafana.demothings.ru"]
